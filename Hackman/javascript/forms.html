<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Login</h2>
    
    <form action="#" method="POST" class="space-y-4">
    <div>
        <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
    <input 
        type="text" 
        id="username" 
        name="username" 
        placeholder="Enter your username" 
        required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        >
    </div>
    <div>
        <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Enter your password" 
        required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        >
    </div>
    <button 
        type="submit" 
        id="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
        >
        Login
    </button>
    </form>
</div>
<script src="./api.js"></script>
</body>
</html>
