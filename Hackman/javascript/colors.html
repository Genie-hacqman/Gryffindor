<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- Top Instruction Bar -->
    <header class="p-4 text-sm text-neutral-800 bg-white border-b border-neutral-100 font-sans">
        Press the <kbd class="bg-neutral-100 px-1.5 py-0.5 rounded border font-mono font-bold">spacebar</kbd> to generate color palettes!
    </header>

    <!-- Color Palette Container -->
    <main id="palette-container" class="flex flex-1 w-full h-full">
        <!-- Column 1 -->
        <section class="flex-1 flex flex-col justify-end items-center pb-16 transition-colors duration-200">
            <h2 class="hex-code text-2xl font-bold tracking-wider mb-2 uppercase font-sans">#5CF64A</h2>
            <p class="color-name text-xs opacity-70 font-sans">Electric Green</p>
        </section>
        <!-- Column 2 -->
        <section class="flex-1 flex flex-col justify-end items-center pb-16 transition-colors duration-200">
            <h2 class="hex-code text-2xl font-bold tracking-wider mb-2 uppercase font-sans">#87E752</h2>
            <p class="color-name text-xs opacity-70 font-sans">Radioactive Grass</p>
        </section>
        <!-- Column 3 -->
        <section class="flex-1 flex flex-col justify-end items-center pb-16 transition-colors duration-200">
            <h2 class="hex-code text-2xl font-bold tracking-wider mb-2 uppercase font-sans">#43B929</h2>
            <p class="color-name text-xs opacity-70 font-sans">Bright Fern</p>
        </section>
        <!-- Column 4 -->
        <section class="flex-1 flex flex-col justify-end items-center pb-16 transition-colors duration-200">
            <h2 class="hex-code text-2xl font-bold tracking-wider mb-2 uppercase font-sans">#FFCAE9</h2>
            <p class="color-name text-xs opacity-70 font-sans">Pastel Petal</p>
        </section>
        <!-- Column 5 -->
        <section class="flex-1 flex flex-col justify-end items-center pb-16 transition-colors duration-200">
            <h2 class="hex-code text-2xl font-bold tracking-wider mb-2 uppercase font-sans">#FF37A6</h2>
            <p class="color-name text-xs opacity-70 font-sans">Brilliant Rose</p>
        </section>
        <!-- Column 6 -->
        <section class="flex-1 flex flex-col justify-end items-center pb-16 transition-colors duration-200">
            <h2 class="hex-code text-2xl font-bold tracking-wider mb-2 uppercase font-sans">#FF69B4</h2>
            <p class="color-name text-xs opacity-70 font-sans">Hot Pink</p>
        </section>
    </main>

    <script>
        const initialColors = ['#5CF64A', '#87E752', '#43B929', '#FFCAE9', '#FF37A6'];
        const columns = document.querySelectorAll('#palette-container section');

        // Helper: Generate random hex values
        function generateRandomHex() {
            const chars = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += chars[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Helper: Calculate brightness for dynamic dark/light text contrast
        function getContrastColor(hex) {
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        // Action: Apply colors and update text values
        function updateColumnStyles(column, hexValue, customName = "Generated Color") {
            const hexText = column.querySelector('.hex-code');
            const nameText = column.querySelector('.color-name');
            const textColor = getContrastColor(hexValue);

            column.style.backgroundColor = hexValue;
            hexText.textContent = hexValue;
            nameText.textContent = customName;
            
            hexText.style.color = textColor;
            nameText.style.color = textColor;
        }

        // Action: Loop through all panels to set random colors
        function randomizePalette() {
            columns.forEach(column => {
                updateColumnStyles(column, generateRandomHex());
            });
        }

        // Event: Listen for spacebar key down
        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); // Stop window from scrolling down
                randomizePalette();
            }
        });

        // Initialize UI on first render with your image's exact scheme
        const initialNames = ['Electric Green', 'Radioactive Grass', 'Bright Fern', 'Pastel Petal', 'Brilliant Rose'];
        columns.forEach((column, index) => {
            updateColumnStyles(column, initialColors[index], initialNames[index]);
        });
    </script>
</body>
</html>
